# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Set up Ruby
      #   uses: ruby/setup-ruby@v1 #8575951200e472d5f2d95c625da0c7bec8217c42 # v1.161.0
      #   with:
      #     ruby-version: '3.1' # Not needed with a .ruby-version file
      #     bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      #     cache-version: 0 # Increment this number if you need to re-download cached gems
      #     # ✅ [새 코드] ...이 4개의 단계로 교체하세요.

        # 1. Set up Ruby (bundler-cache 비활성화)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          # bundler-cache: true # <- 이 옵션을 비활성화(제거)합니다.

      # 2. (핵심) 문제가 되는 Gemfile.lock을 강제로 삭제
      - name: Delete Gemfile.lock
        run: rm -f Gemfile.lock

      # 3. 'bundler-cache: true'를 대신할 수동 캐시 설정
      - name: Load cached gems
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          # Gemfile.lock이 없으므로 Gemfile 기준으로 캐시 키를 생성합니다.
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # 4. 수동으로 젬 설치
      - name: Install dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
