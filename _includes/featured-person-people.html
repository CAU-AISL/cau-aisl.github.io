<article class="people-profile-row{% if page.header == 'Alumni' %} people-profile-row-alumni{% endif %}">
  {% unless page.header == 'Alumni' %}
    {% include people-portrait.html image=person.image name=person.title %}
  {% endunless %}
  <div class="people-profile-description">
    {{ person.content | markdownify | replace: '<h2', '<h3' | replace: '</h2>', '</h3>' }}
  </div>
</article>
