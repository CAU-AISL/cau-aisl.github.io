<figure class="people-portrait">
  <svg class="people-portrait-orbits" viewBox="0 0 460 360" fill="none" aria-hidden="true">
    <g stroke="currentColor" opacity=".55">
      <ellipse cx="230" cy="180" rx="208" ry="75" transform="rotate(-26 230 180)" stroke-dasharray="2 4"/>
      <ellipse cx="230" cy="180" rx="213" ry="96" transform="rotate(-40 230 180)" stroke-width=".7"/>
    </g>
    <g fill="white" stroke="currentColor" stroke-width="1.2">
      <circle cx="94" cy="118" r="3"/><circle cx="405" cy="112" r="3"/>
      <circle cx="388" cy="193" r="3"/>
      <path d="M58 260l2 9 7 2-7 2-2 9-2-9-7-2 7-2z"/>
      <path d="M119 257l1.5 7 5 1.5-5 1.5-1.5 7-1.5-7-5-1.5 5-1.5z"/>
    </g>
  </svg>
  {% assign portrait_path = '/assets/img/' | append: include.image %}
  <img class="people-portrait-photo" src="{{ portrait_path | relative_url }}" alt="{{ include.name | escape }}" loading="lazy">
</figure>
