---
layout: default
title: Gallery
---
{% include page-title.html %}
<div class="editorial-page moments-page">
  <div class="moments-grid">
    {% assign sorted_gallery = site.gallery | sort: 'date' | reverse %}
    {% for gallery in sorted_gallery %}
    <article class="moment-card">
      <a href="{{ gallery.url | relative_url }}">
        <h3>{{ gallery.title }}</h3>
        <time datetime="{{ gallery.date | date: '%Y-%m-%d' }}">{{ gallery.date | date: "%b %-d, %Y" }}</time>
        <div class="moment-photo"><img src="{{ '/assets/img/Gallery/' | append: gallery.img | relative_url }}" alt="{{ gallery.title | escape }}" loading="lazy"></div>
      </a>
    </article>
    {% endfor %}
  </div>
</div>
