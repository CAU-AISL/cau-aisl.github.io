---
layout: default
title: Boards
---

{% include page-title.html %}

<div class="gallery">
    <div class="content-wrapper">
    <div>
        <div class="board">
            <h1>Gallery</h1>
            <div style="display: flex;justify-content: center;">
                <div class="gallery-grid">
                    {% assign sorted_gallery = site.gallery | sort: 'date' | reverse %}
                    {% for gallery in sorted_gallery %}
                        <div class="gallery-item">
                            <img src="/assets/img/Gallery/{{gallery.img}}"/>
                            <div class="titlearea"><a href="{{ gallery.url}}">{{gallery.title}}</a></div>
                            <div class="datearea"><span>{{gallery.date | date: "%b %-d, %Y"}}</span></div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
