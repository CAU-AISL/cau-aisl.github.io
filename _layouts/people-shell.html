<!doctype html>
<html lang="en">
  {% include head.html %}
  <body class="aisl-people aisl-inner" id="page-top">
    <a class="aisl-skip" href="#people-content">Skip to content</a>
    <div class="site-navigation-shell">{% include home-navigation.html %}</div>
    {% include people-banner.html %}
    <nav class="people-page-tabs" aria-label="People pages">
      <a href="{{ '/People' | relative_url }}"{% if page.header == 'Professor' %} aria-current="page"{% endif %}>Professor</a>
      <a href="{{ '/Member' | relative_url }}"{% if page.header == 'Member' %} aria-current="page"{% endif %}>Member</a>
      <a href="{{ '/Alumni' | relative_url }}"{% if page.header == 'Alumni' %} aria-current="page"{% endif %}>Alumni</a>
    </nav>
    <main id="people-content" class="people-content" tabindex="-1">{{ content }}</main>
    {% include home-footer.html %}
    <script src="{{ '/assets/js/site-navigation.js' | relative_url }}" defer></script>
  </body>
</html>
